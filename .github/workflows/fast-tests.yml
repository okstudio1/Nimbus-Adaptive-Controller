name: Fast tests

# The fast, hardware-free suite (tests/run_fast_tests.py). The game harness,
# the driver probes and the vJoy diagnostics stay out of CI for good: they
# need Steam, a signed-in account, a GPU and a virtual pad driver, and a
# person runs them (docs/vision/TESTING_STRATEGY.md, section 4.1).

on:
  push:
    # Branches in this repository also raise pull_request, so an unfiltered
    # push trigger ran the whole suite twice on the same commit. main is the
    # only branch that needs the push run.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs are pointless once a newer commit exists on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # PyInstaller is only for packaging, so the runner skips it. Nothing else
      # in requirements.txt may touch a driver at install time: the virtual pad
      # client is pure Python (src/padbus_client.py) and the app degrades
      # gracefully when no bus driver is present.
      #
      # That is a requirement of this job, not an observation. A dependency
      # whose installer runs a driver setup never returns here: vgamepad was
      # added on 2026-09-12 and every run on every branch carrying it hung in
      # this step until the job timed out, executing no tests. requirements.txt
      # carries the same warning next to the dependency list.
      - name: Install dependencies
        shell: pwsh
        # The whole job takes about a minute, so ten is already generous. A
        # step timeout fails as a step failure naming this step; letting it
        # reach the 30 minute job timeout instead is recorded as "cancelled",
        # which reads like an infrastructure problem rather than a hang.
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^pyinstaller' } | Set-Content ci-requirements.txt
          Get-Content ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Run the fast suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_fast_tests.py
